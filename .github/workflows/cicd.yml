name: ci

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 'release/*' ]
  pull_request:
    branches: [ master, main, 'release/*' ]

jobs:
  test:
    # OTP 27 is the floor: the port uses the built-in `json' module rather
    # than a hex JSON library.
    name: OTP ${{ matrix.otp_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        otp_version: ['27', '28']

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp_version }}
          rebar3-version: '3.24'
      - name: Compile
        run: rebar3 compile
      - name: Unit and system tests
        run: rebar3 as test lfe ltest --test-type=all
      - name: Build release
        run: rebar3 as prod release

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t auctions-lfe:ci .
      - name: Smoke test the release
        run: |
          docker run -d --name auctions-ci -p 8080:8080 auctions-lfe:ci
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/auctions && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/auctions
          docker rm -f auctions-ci
